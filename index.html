<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindrix AI - التطبيق المتطور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط العنوان الفخم -->
  <header>
    Mindrix AI ⚡
  </header>

  <!-- صندوق المحادثة -->
  <div class="chat-container" id="chatContainer">
    <div class="message ai-message">
      Welcome to Mindrix AI! ⚡ أهلاً بك، أنا جاهز لمساعدتك في أي سؤال، فكرة، أو برمجة.
    </div>
  </div>

  <!-- خانة إرسال الرسائل -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب سؤالك أو فكرتك هنا..." autocomplete="off">
    <button id="sendBtn">إرسال</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      if (sender === 'user') {
        msgDiv.classList.add('user-message');
      } else {
        msgDiv.classList.add('ai-message');
      }
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';

      // محاكاة رد ذكي وفخم من الـ AI
      setTimeout(() => {
        let reply = "أهلاً بك! لقد تلقيت رسالتك بنجاح وأنا أعمل على تنفيذ فكرتك بكل دقة.";
        if (text.includes("نكتة")) {
          reply = "إيش رايح تسوي لو جاك رجل وأنت نايم وقالك: 'آسف، ضيعت الطريق'؟ تقول له: 'طيب، نام هنا حتى تسوقه مرة تانية'!";
        } else if (text.includes("لعبة")) {
          reply = "أفضل طريقة لتبدأ بصناعة الألعاب هي استخدام HTML مع JavaScript أو الانتقال لمحرك Unity لاحقاً!";
        }
        addMessage(reply, 'ai');
      }, 1000);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>

</body>
</html>
