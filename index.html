const SYSTEM_PROMPT = `
You are Mindrix AI, a smart and helpful assistant. Your rules:
- Always reply in the same language the user uses.
- Understand the context of previous conversations before answering.
- Do not treat each message as a new conversation.
- Connect words like "this" or "that" to previous information.
- Do not repeat the same answer without reason.
- Do not start every answer with the same phrase.
- Be clear and natural.
- Do not invent information.
- If you don't know something, say you are not sure.

- Do not add random numbers or weird words at the end of the answer.

- When the user asks to generate an image, automatically enhance, expand, and optimize their prompt with high-detail descriptive keywords (like cinematic lighting, 4k, hyper-realistic, beautiful composition) to ensure the generated image looks stunning and high quality.

`;

function addMessage(text, sender, type = "text") {

    img.loading = "lazy";
    msgDiv.appendChild(img);

  chatContainer.appendChild(msgDiv);

}

async function checkImageSafety(prompt) {

  const safetyPolicy = `
أنت نظام أمان لتطبيق Mindrix AI.

حدد هل طلب إنشاء الصورة مناسب وآمن أم لا.

اعتبر الطلب غير مسموح إذا كان يطلب:
- محتوى جنسي أو إباحي.
- تعرٍ أو محتوى غير مناسب.
- استغلال القاصرين.
- عنف أو دماء بشكل صريح.
- أي محتوى غير مناسب للعامة.

الطلبات العادية مثل:
الطبيعة، الحيوانات، الألعاب، السيارات،
الفضاء، الرسومات، الأنمي، الشعارات،
المباني والمناظر تعتبر آمنة.

أجب فقط:
SAFE
أو
BLOCK
`;

  try {

    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + GROQ_API_KEY
        },

        body: JSON.stringify({
          model: "openai/gpt-oss-safeguard-20b",

          messages: [
            {
              role: "system",
              content: safetyPolicy
            },
            {
              role: "user",
              content: prompt
            }
          ],

          temperature: 0,
          max_tokens: 10
        })
      }
    );

    if (!response.ok) {
      return false;
    }

    const data = await response.json();

    const result =
      data?.choices?.[0]?.message?.content
        ?.trim()
        ?.toUpperCase();

    return result === "SAFE";

  } catch (error) {

    console.error("Safety error:", error);

    return false;
  }
}

}

async function askGroq() {
  const messages = [
    { role: "system", content: SYSTEM_PROMPT },
    ...conversation
  ];

  const response = await fetch(
    "https://api.groq.com/openai/v1/chat/completions",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: messages,
        temperature: 0.7,
        max_tokens: 2048
      })
    }
  );

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error("Groq API Error: " + response.status + " " + errorText);
  }

  const data = await response.json();
  if (!data.choices || !data.choices[0] || !data.choices[0].message) {
    throw new Error("رد Groq غير صالح");
  }

  return data.choices[0].message.content.trim();
}

    const image = new Image();

    image.onload = () => resolve(url);

    image.onerror = () => resolve(null);

    image.src = url;
  });
}

    sendBtn.disabled = false;
    userInput.focus();

    return;
  }


  /* وضع المحادثة الذكية */
  isLoading = true;
  sendBtn.disabled = true;

  conversation.push({
    role: "user",
    content: text
  });

  saveConversation();

  const loading = addMessage(
    "جاري التفكير...",
    "ai"
  );

  try {

    const reply = await askGroq();

    loading.remove();

    addMessage(
      reply,
      "ai"
    );

    conversation.push({
      role: "assistant",
      content: reply
    });

    saveConversation();

  } catch (error) {

    console.error(
      "Mindrix AI Error:",
      error
    );

    loading.textContent =
      "عذراً، حدث خطأ في الاتصال بالذكاء الاصطناعي. تأكد من مفتاح API وحاول مرة أخرى.";
  }

  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}


/* =========================================================
   الأحداث
   ========================================================= */

sendBtn.addEventListener("click", handleSend);

userInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    handleSend();
  }
});


/* =========================================================
   تشغيل التطبيق
   ========================================================= */

loadConversation();
// 1. تفعيل زر الإرسال
document.getElementById("sendBtn").onclick = function() {
    handleSend();
};

// 2. تفعيل الميكروفون الصوتي
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "ar-SA";
recognition.onresult = function(e) {
    document.getElementById("userInput").value = e.results[0][0].transcript;
    handleSend();
};
document.getElementById("voiceBtn").onclick = function() {
    recognition.start();
};

// 3. تفعيل زر القائمة (+)
document.getElementById("addBtn").onclick = function(e) {
    e.stopPropagation();
    document.getElementById("actionMenu").classList.toggle("active");
};

</script>
