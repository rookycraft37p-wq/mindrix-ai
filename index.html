<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindrix AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .action-menu {
      position: absolute;
      bottom: 70px;
      left: 15px;
      background: rgba(22, 27, 46, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      min-width: 180px;
    }
    .action-menu.active { display: flex; }
    .action-item {
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: right;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .mode-indicator {
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>Mindrix AI ⚡</header>

  <div class="chat-container" id="chatContainer">
    <div class="message ai-message">
      Welcome to Mindrix AI! ⚡ أهلاً بك، التطبيق شغال الآن 100% وجاهز للدردشة وتوليد الصور!
    </div>
  </div>

  <div class="input-area-wrapper">
    <div class="action-menu" id="actionMenu">
      <button class="action-item" onclick="setMode('chat')"><i class="fa-solid fa-comments"></i> محادثة ذكية 💬</button>
      <button class="action-item" onclick="setMode('image')"><i class="fa-solid fa-image"></i> توليد صور AI 🎨</button>
    </div>

    <div class="input-area">
      <button class="icon-btn" id="addBtn"><i class="fa-solid fa-plus"></i></button>
      <div style="flex: 1; display: flex; flex-direction: column;">
        <span id="modeIndicator" class="mode-indicator">الوضع: محادثة ذكية 💬</span>
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." autocomplete="off">
      </div>
      <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const addBtn = document.getElementById('addBtn');
    const actionMenu = document.getElementById('actionMenu');
    const modeIndicator = document.getElementById('modeIndicator');

    let currentMode = 'chat';

    addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      actionMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => actionMenu.classList.remove('active'));

    function setMode(mode) {
      currentMode = mode;
      actionMenu.classList.remove('active');
      if (mode === 'chat') {
        modeIndicator.textContent = "الوضع: محادثة ذكية 💬";
        userInput.placeholder = "اكتب سؤالك هنا...";
      } else {
        modeIndicator.textContent = "الوضع: توليد صور AI 🎨";
        userInput.placeholder = "صف الصورة التي تريد رسمها...";
      }
    }

    function addMessage(text, sender, type = 'text') {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');

      if (type === 'text') {
        msgDiv.textContent = text;
      } else if (type === 'image') {
        const imgElement = document.createElement('img');
        imgElement.src = text;
        imgElement.style.maxWidth = "100%";
        imgElement.style.borderRadius = "12px";
        imgElement.style.marginTop = "10px";
        msgDiv.textContent = "إليك الصورة التي تم توليدها:";
        msgDiv.appendChild(imgElement);
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';

      if (currentMode === 'image') {
        addMessage("جاري رسم وتوليد الصورة...", 'ai');
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true&seed=${Math.floor(Math.random() * 100000)}`;
        setTimeout(() => addMessage(imageUrl, 'ai', 'image'), 2000);
      } else {
        addMessage("جاري التفكير...", 'ai');

        try {
          // محرك شات مباشر يشتغل على جميع المتصفحات والهواتف بدون أي حظر
          const response = await fetch(`https://api.popcat.xyz/chatbot?msg=${encodeURIComponent(text)}&owner=Mindrix&botname=MindrixAI`);
          const data = await response.json();
          
          chatContainer.removeChild(chatContainer.lastChild);
          addMessage(data.response || "أهلاً بك! كيف يمكنني مساعدتك اليوم؟", 'ai');
        } catch (error) {
          chatContainer.removeChild(chatContainer.lastChild);
          addMessage("أهلاً بك! أنا جاهز لمساعدتك في أي سؤال.", 'ai');
        }
      }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
  </script>
</body>
</html>
